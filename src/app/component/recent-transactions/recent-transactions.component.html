<div class="card border-0 shadow-sm">
  <div class="card-header bg-white border-0 d-flex justify-content-between align-items-center pb-0 pt-3">
    <h5 class="mb-0 fw-bold">Recent Transactions</h5>
    <button class="btn btn-primary btn-sm rounded-1">View All</button>
  </div>
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center mb-4" *ngFor="let tx of transactions">
      <div class="d-flex align-items-center">
        <div class="icon-container rounded-1 d-flex justify-content-center align-items-center text-white me-3"
          [ngClass]="{
                'bg-success': tx.status === 'Completed',
                'bg-primary': tx.status === 'Active',
                'bg-warning': tx.status === 'Pending',
                'bg-danger': tx.status === 'Overdue'
             }">
          <mat-icon *ngIf="tx.action === 'Return'">library_books</mat-icon>
          <mat-icon *ngIf="tx.action === 'Borrow'">menu_book</mat-icon>
          <mat-icon *ngIf="tx.action === 'Reserve'">bookmark</mat-icon>
        </div>
        <div>
          <h6 class="mb-1 fw-bold">{{ tx.userName }} - {{ tx.bookTitle }}</h6>
          <small class="text-muted">{{ tx.action }} &bull; {{ tx.timeAgo }}</small>
        </div>
      </div>
      <div class="text-end">
        <span class="badge rounded-1 fw-normal px-2 py-1" [ngClass]="{
                 'text-bg-success': tx.status === 'Completed',
                 'text-bg-primary': tx.status === 'Active',
                 'text-bg-warning': tx.status === 'Pending',
                 'text-bg-danger': tx.status === 'Overdue'
              }">
          {{ tx.status }}
        </span>
        <div class="text-muted mt-1"><small>-</small></div>
      </div>
    </div>
  </div>
</div>
