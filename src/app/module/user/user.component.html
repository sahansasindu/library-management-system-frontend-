<app-userheader></app-userheader>

<mat-drawer-container class="example-container" autosize>

  <mat-drawer [opened]="opened" class="user-sidebar" mode="side">
    <mat-list class="user-sidebar-list">
      <mat-list-item [routerLinkActive]="['active']" class="nav-item">
        <mat-icon mat-list-icon>dashboard</mat-icon>
        <a routerLink="dashboard" mat-line>Dashboard</a>
      </mat-list-item>

      <mat-list-item [routerLinkActive]="['active']" class="nav-item">
        <mat-icon mat-list-icon>library_books</mat-icon>
        <a routerLink="reservation" mat-line>Books & Reservations</a>
      </mat-list-item>

      <mat-list-item [routerLinkActive]="['active']" class="nav-item">
        <mat-icon mat-list-icon>manage_accounts</mat-icon>
        <a routerLink="manageuserprofile" mat-line>Manage Profile</a>
      </mat-list-item>

      <mat-list-item [routerLinkActive]="['active']" class="nav-item logout-item">
        <mat-icon mat-list-icon>logout</mat-icon>
        <a routerLink="" mat-line>Logout</a>
      </mat-list-item>
    </mat-list>
  </mat-drawer>

  <!-- Main Content -->
  <mat-drawer-content>
    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </mat-drawer-content>
</mat-drawer-container>

<app-ai-assistant></app-ai-assistant>
