<div class="reservation-container">
  <div class="page-header">
    <div class="title-section">
      <h2>Explore Our Library</h2>
      <p>Discover and reserve your next favorite book</p>
    </div>

    <div class="search-section">
      <div class="search-box">
        <mat-icon>search</mat-icon>
        <input type="text" [(ngModel)]="searchText" (input)="onSearch()"
          placeholder="Search by title, author, or category...">
      </div>
    </div>
  </div>

  <div class="loading-overlay" *ngIf="isLoading">
    <mat-spinner diameter="40"></mat-spinner>
  </div>

  <div class="books-grid" *ngIf="!isLoading">
    <div *ngFor="let book of books">
      <app-book-card [book]="book">
        <div card-actions class="w-100">
          <button mat-flat-button color="primary" class="reserve-btn w-100" [disabled]="book.qty <= 0"
            (click)="reserveBook(book.bookid)">
            <mat-icon>bookmark_add</mat-icon>
            Reserve Now
          </button>
        </div>
      </app-book-card>
    </div>
  </div>

  <div class="no-results" *ngIf="!isLoading && books.length === 0">
    <mat-icon>search_off</mat-icon>
    <p>No books found matching your search.</p>
  </div>

  <div class="pagination-container">
    <mat-paginator [length]="totalItems" [pageSize]="size" [pageSizeOptions]="[4, 8, 12, 24]"
      (page)="onPageChange($event)" aria-label="Select page">
    </mat-paginator>
  </div>
</div>
