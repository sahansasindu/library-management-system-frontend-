<div class="container mt-4">
  <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Reservation</a>
      <div class="d-flex">
        <button class="btn btn-outline-primary me-2" (click)="showAddBook()">Book List</button>
        <button class="btn btn-outline-secondary" (click)="showBookList()">Reservation Details</button>
      </div>
    </div>
  </nav>


<div *ngIf="!isAddBookVisible" class="book-list-container">
  <h2>Book List</h2>

  <!-- Search Bar -->
  <div class="mb-3">
    <input type="text" class="form-control" [(ngModel)]="searchTerm" placeholder="Search books..." />
  </div>

  <div class="row">
    <div class="col-md-4 mb-3" *ngFor="let book of filteredBooks()">
      <div class="card">
        <!-- Ensure image fills the card with consistent size -->
        <img [src]="book.photoBase64 ? book.photoBase64 : 'assets/default-book.png'" class="card-img-top book-image" alt="Book Image">
        <div class="card-body">
          <h5 class="card-title"><strong>Title:</strong>{{ book.title }}</h5>
          <h6 class="card-subtitle mb-2 text-muted"><strong>Author:</strong>{{ book.author }}</h6>
          <p class="card-text"><strong>Category:</strong> {{ book.category }}</p>
          <p class="card-text"><strong>ISBN:</strong> {{ book.isbn }}</p>
          <button class="btn btn-success btn-sm" (click)="reserveBook(book)" *ngIf="!book.reserved">Reserved</button>
          <button class="btn btn-warning btn-sm" (click)="closeReservation(book)" *ngIf="book.reserved">Unreserved</button>
        </div>
      </div>
    </div>
  </div>
</div>
</div>
