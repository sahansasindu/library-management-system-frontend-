<header class="user-header">
  <div class="header-left">
    <button class="menu-btn" (click)='toggleMenu()' aria-label="Toggle menu" title="Toggle menu">
      <mat-icon>menu</mat-icon>
    </button>
    <div class="brand">
      <mat-icon class="brand-icon">auto_stories</mat-icon>
      <span class="brand-text">My Library</span>
    </div>
  </div>

  <div class="header-right">
    <div class="search-bar">
      <mat-icon>search</mat-icon>
      <input type="text" placeholder="Search books, authors...">
    </div>
    
    <button class="action-btn" aria-label="Notifications" title="Notifications">
      <mat-icon>notifications</mat-icon>
      <span class="badge">2</span>
    </button>

    <div class="user-profile">
      <img src="https://ui-avatars.com/api/?name=User+Member&background=8b5cf6&color=fff&bold=true" alt="User avatar" class="avatar">
      <div class="user-info">
        <span class="user-name">User Member</span>
        <span class="user-role">Member</span>
      </div>
      <mat-icon class="dropdown-icon">expand_more</mat-icon>
    </div>
  </div>
</header>
