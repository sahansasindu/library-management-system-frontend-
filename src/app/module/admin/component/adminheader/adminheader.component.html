<header class="admin-header">
  <div class="header-left">
    <button class="menu-btn" (click)="toggleMenu()" aria-label="Toggle menu" title="Toggle menu">
      <mat-icon>menu</mat-icon>
    </button>
    <div class="brand">
      <mat-icon class="brand-icon">auto_stories</mat-icon>
      <span class="brand-text">Library Admin</span>
    </div>
  </div>

  <div class="header-right">
    <div class="search-bar">
      <mat-icon>search</mat-icon>
      <input type="text" placeholder="Search resources...">
    </div>
    
    <button class="action-btn" aria-label="Notifications" title="Notifications">
      <mat-icon>notifications</mat-icon>
      <span class="badge">3</span>
    </button>

    <div class="user-profile">
      <img src="https://ui-avatars.com/api/?name=Admin+User&background=3b82f6&color=fff&bold=true" alt="Admin avatar" class="avatar">
      <div class="user-info">
        <span class="user-name">Admin User</span>
        <span class="user-role">Administrator</span>
      </div>
      <mat-icon class="dropdown-icon">expand_more</mat-icon>
    </div>
  </div>
</header>
