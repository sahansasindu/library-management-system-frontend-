<div class="container mt-4">
  <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">MANAGE BOOKS</a>
      <div class="d-flex">
        <button class="btn btn-outline-primary me-2" (click)="showAddBook()">Add Book</button>
        <button class="btn btn-outline-secondary" (click)="showBookList()">Display Books</button>
      </div>
    </div>
  </nav>

  <div *ngIf="isAddBookVisible">
    <h2>Add New Book</h2>
    <form #adbook="ngForm" (ngSubmit)="onSubmit(adbook)">
      <div class="mb-3">
        <label class="form-label">Book Id</label>
        <input type="text" class="form-control" name="bookid" [(ngModel)]="book.bookid" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Title</label>
        <input type="text" class="form-control" name="title" [(ngModel)]="book.title" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Author</label>
        <input type="text" class="form-control" name="author" [(ngModel)]="book.author" required />
      </div>
      <div class="mb-3">
        <label class="form-label">ISBN</label>
        <input type="text" class="form-control" name="isbn" [(ngModel)]="book.isbn" required />
      </div>
      <div class="mb-3">
        <label class="form-label d-flex justify-content-between align-items-center">
          <span>Category</span>
          <button type="button" class="btn btn-sm btn-link p-0 text-decoration-none" (click)="toggleNewCategoryInput()">
            {{ isAddingNewCategory ? 'Choose Existing' : 'Add New Category' }}
          </button>
        </label>

        <select *ngIf="!isAddingNewCategory" class="form-control" name="category" [(ngModel)]="book.category" required>
          <option value="" disabled selected>Select Category</option>
          <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
        </select>

        <div *ngIf="isAddingNewCategory" class="input-group">
          <input type="text" class="form-control" placeholder="Type new category name..." [(ngModel)]="newCategoryName"
            name="newCategoryInputName" />
          <button type="button" class="btn btn-outline-secondary" (click)="addNewCategory()">Add</button>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Quantity</label>
        <input type="number" class="form-control" name="qty" [(ngModel)]="book.qty" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Upload File</label>
        <input type="file" class="form-control" (change)="onFileSelected($event)" />
      </div>
      <button type="submit" class="btn btn-primary">Add Book</button>
    </form>
  </div>

  <div *ngIf="!isAddBookVisible">
    <h2>Book List</h2>

    <div class="row mb-3">
      <div class="col-md-4">
        <input type="text" class="form-control" placeholder="Search books..." [(ngModel)]="searchText"
          (input)="onSearchChange()">
      </div>
    </div>

    <div class="row">

      <div class="col-md-4 mb-4" *ngFor="let book of bookList">
        <app-book-card [book]="book">
          <div card-actions class="d-flex w-100 justify-content-end mt-2">
            <button class="btn btn-success btn-sm w-100" (click)="reserveBook(book)" *ngIf="book.activeState">
              <mat-icon
                style="vertical-align: middle; margin-right: 4px; font-size: 18px; width: 18px; height: 18px;">ac_unit</mat-icon>
              Freeze
            </button>
            <button class="btn btn-warning btn-sm w-100" (click)="closeReservation(book)" *ngIf="!book.activeState">
              <mat-icon
                style="vertical-align: middle; margin-right: 4px; font-size: 18px; width: 18px; height: 18px;">wb_sunny</mat-icon>
              Unfreeze
            </button>
          </div>
        </app-book-card>
      </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mt-3">
      <div>
        Showing {{ bookList.length }} of {{ totalBooks }} books
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-sm btn-outline-secondary" [disabled]="page === 0"
          (click)="previousPage()">Previous</button>
        <span class="align-self-center">Page {{ page + 1 }}</span>
        <button class="btn btn-sm btn-outline-secondary" [disabled]="(page + 1) * size >= totalBooks"
          (click)="nextPage()">Next</button>
      </div>
    </div>

  </div>
</div>
