<app-adminheader></app-adminheader>

<mat-drawer-container class="example-container" autosize>

  <mat-drawer [opened]="opened" class="example-sidenav" mode="side">
    <mat-list>
      <mat-list-item [routerLinkActive]="['active']">
        <mat-icon color="primary" mat-list-icon>dashboard</mat-icon>
        <a routerLink="admindashboard" mat-line>Dashboard</a>
      </mat-list-item>

      <mat-list-item [routerLinkActive]="['active']">
        <mat-icon color="primary" mat-list-icon>adduser</mat-icon>
        <a routerLink="adduser" mat-line>Add user</a>
      </mat-list-item>
      <mat-list-item [routerLinkActive]="['active']">
        <mat-icon color="primary" mat-list-icon>book</mat-icon>
        <a routerLink="addbook" mat-line>Manage Book</a>
      </mat-list-item>
      <mat-list-item [routerLinkActive]="['active']">
        <mat-icon color="primary" mat-list-icon>library_add_check</mat-icon>
        <a routerLink="bookcirculation" mat-line>Circulation</a>
      </mat-list-item>
      <mat-list-item [routerLinkActive]="['active']">
        <mat-icon color="primary" mat-list-icon>request_quote</mat-icon>
        <a routerLink="managefees" mat-line>Fees Management</a>
      </mat-list-item>
      <mat-list-item [routerLinkActive]="['active']">
        <mat-icon color="primary" mat-list-icon>manage_accounts</mat-icon>
        <a routerLink="manageprofile" mat-line>Profile</a>
      </mat-list-item>

      <mat-list-item (click)="logout()">
        <mat-icon color="primary" mat-list-icon>logout</mat-icon>
        <a>Logout</a>
      </mat-list-item>



    </mat-list>
  </mat-drawer>

  <!-- Main Content -->
  <mat-drawer-content>
    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </mat-drawer-content>
</mat-drawer-container>
